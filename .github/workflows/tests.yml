name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python tests/test_retrorenamer.py
      - name: GUI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a python -c "import retrorenamer_gui as g; g.App.check_update = lambda self, silent: None; a = g.App(); a.update(); print(a.title()); a.destroy()"
