name: Build Windows EXE

# Baut bei jeder veroeffentlichten Release die RetroRenamer.exe und haengt sie an die Release an.
# Die eingebaute Update-Funktion der EXE-Version laedt genau diese Datei.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python tests/test_retrorenamer.py
      - name: Build EXE
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name RetroRenamer retrorenamer_gui.py
      - name: Upload EXE to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/RetroRenamer.exe --clobber
